
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuis Matematika - Eksponen Kelas X</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: linear-gradient(135deg, #dbeafe, #ede9fe);
    color: #1e293b;
}

.container {
    max-width: 750px;
    margin: 40px auto;
    padding: 25px;
}

.header {
    background: #4338ca;
    color: white;
    text-align: center;
    padding: 30px 20px;
    border-radius: 16px;
}

.header h1 {
    margin: 0 0 10px;
}

.card {
    background: white;
    padding: 25px;
    margin-top: 20px;
    border-radius: 16px;
    box-shadow: 0 5px 20px #00000012;
}

.info {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
    font-weight: bold;
    color: #4338ca;
}

.question {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 20px;
    line-height: 1.6;
}

.option {
    display: block;
    background: #f1f5f9;
    border: 2px solid transparent;
    padding: 14px;
    margin: 10px 0;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    background: #e0e7ff;
    border-color: #6366f1;
}

.option input {
    margin-right: 10px;
}

button {
    background: #4338ca;
    color: white;
    border: none;
    padding: 13px 25px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    margin-top: 15px;
}

button:hover {
    background: #312e81;
}

button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

#feedback {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    display: none;
    line-height: 1.6;
}

.correct {
    background: #dcfce7;
    color: #166534;
}

.wrong {
    background: #fee2e2;
    color: #991b1b;
}

#result {
    text-align: center;
    display: none;
}

.score {
    font-size: 45px;
    font-weight: bold;
    color: #4338ca;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #64748b;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎓 KUIS MATEMATIKA</h1>
        <h2>Materi Eksponen - Kelas X</h2>
        <p>Uji kemampuanmu dalam memahami bilangan berpangkat!</p>
    </div>

    <div class="card" id="quiz">

        <div class="info">
            <span id="progress">Soal 1 dari 10</span>
            <span id="timer">⏱ 15:00</span>
        </div>

        <div class="question" id="question"></div>

        <div id="options"></div>

        <div id="feedback"></div>

        <button id="nextBtn" onclick="nextQuestion()">
            Periksa Jawaban
        </button>

    </div>

    <div class="card" id="result">
        <h2>🎉 Kuis Selesai!</h2>
        <p>Nilai akhir kamu:</p>
        <div class="score" id="score"></div>
        <p id="message"></p>
        <p id="detail"></p>
        <button onclick="restartQuiz()">Ulangi Kuis</button>
    </div>

    <div class="footer">
        Media Pembelajaran Matematika Kelas X
        <br>Materi: Eksponen
    </div>

</div>

<script>

const questions = [
{
q: "Hasil dari 2³ × 2⁴ adalah ...",
options: ["2⁷", "2¹²", "2¹", "2⁹"],
answer: 0,
explain: "Jika basis sama dikalikan, pangkat dijumlahkan. 2³ × 2⁴ = 2³⁺⁴ = 2⁷."
},
{
q: "Hasil dari 5⁶ ÷ 5² adalah ...",
options: ["5⁸", "5⁴", "5³", "5¹²"],
answer: 1,
explain: "Jika basis sama dibagi, pangkat dikurangkan. 5⁶ ÷ 5² = 5⁶⁻² = 5⁴."
},
{
q: "Bentuk sederhana dari (3²)³ adalah ...",
options: ["3⁵", "3⁶", "3⁹", "3¹"],
answer: 1,
explain: "Pangkat dipangkatkan berarti pangkat dikalikan. (3²)³ = 3²ˣ³ = 3⁶."
},
{
q: "Nilai dari 2⁻³ adalah ...",
options: ["-8", "8", "1/8", "1/6"],
answer: 2,
explain: "Pangkat negatif berarti kebalikan. 2⁻³ = 1/2³ = 1/8."
},
{
q: "Hasil dari 16^(1/2) adalah ...",
options: ["2", "4", "8", "16"],
answer: 1,
explain: "16^(1/2) = √16 = 4."
},
{
q: "Jika 3ˣ = 81, maka nilai x adalah ...",
options: ["2", "3", "4", "5"],
answer: 2,
explain: "Karena 81 = 3⁴, maka 3ˣ = 3⁴ sehingga x = 4."
},
{
q: "Hasil dari 4² × 2³ adalah ...",
options: ["64", "96", "128", "256"],
answer: 2,
explain: "4² = (2²)² = 2⁴. Jadi 2⁴ × 2³ = 2⁷ = 128."
},
{
q: "Bentuk sederhana dari (a³b²)² adalah ...",
options: ["a⁵b⁴", "a⁶b⁴", "a⁶b²", "a⁹b⁴"],
answer: 1,
explain: "Setiap pangkat dikalikan 2. Hasilnya a⁶b⁴."
},
{
q: "Jika 2ˣ⁺¹ = 32, maka nilai x adalah ...",
options: ["2", "3", "4", "5"],
answer: 1,
explain: "32 = 2⁵, sehingga x + 1 = 5. Jadi x = 4. Perhatikan: pilihan yang benar seharusnya 4 (C)."
},
{
q: "Sebuah bakteri membelah menjadi 2 kali lipat setiap jam. Jika awalnya terdapat 5 bakteri, berapa jumlahnya setelah 4 jam?",
options: ["20", "40", "80", "100"],
answer: 2,
explain: "Jumlah = 5 × 2⁴ = 5 × 16 = 80 bakteri."
}
];

let current = 0;
let score = 0;
let answered = false;
let timeLeft = 900;
let timerInterval;

function showQuestion() {
    answered = false;

    const q = questions[current];

    document.getElementById("progress").innerText =
        `Soal ${current + 1} dari ${questions.length}`;

    document.getElementById("question").innerText =
        (current + 1) + ". " + q.q;

    document.getElementById("options").innerHTML =
        q.options.map((option, index) => `
            <label class="option">
                <input type="radio" name="answer" value="${index}">
                ${String.fromCharCode(65 + index)}. ${option}
            </label>
        `).join("");

    document.getElementById("feedback").style.display = "none";

    document.getElementById("nextBtn").innerText =
        "Periksa Jawaban";
}

function nextQuestion() {

    const selected = document.querySelector(
        'input[name="answer"]:checked'
    );

    if (!answered) {

        if (!selected) {
            alert("Silakan pilih jawaban terlebih dahulu!");
            return;
        }

        answered = true;

        const userAnswer = Number(selected.value);
        const q = questions[current];
        const correct = userAnswer === q.answer;

        if (correct) score++;

        document.querySelectorAll('input[name="answer"]')
            .forEach(input => input.disabled = true);

        const feedback = document.getElementById("feedback");
        feedback.style.display = "block";
        feedback.className = correct ? "correct" : "wrong";

        feedback.innerHTML = `
            <strong>${correct ? "✓ Jawaban Benar!" : "✗ Jawaban Kurang Tepat"}</strong>
            <br>Jawaban benar: ${String.fromCharCode(65 + q.answer)}. ${q.options[q.answer]}
            <br><strong>Pembahasan:</strong> ${q.explain}
        `;

        document.getElementById("nextBtn").innerText =
            current === questions.length - 1 ?
            "Lihat Hasil" : "Soal Berikutnya";

    } else {

        if (current < questions.length - 1) {
            current++;
            showQuestion();
        } else {
            finishQuiz();
        }
    }
}

function finishQuiz() {

    clearInterval(timerInterval);

    const finalScore = Math.round(
        score / questions.length * 100
    );

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("score").innerText =
        finalScore;

    document.getElementById("message").innerText =
        finalScore >= 80 ? "Hebat! Kamu menguasai materi eksponen." :
        finalScore >= 60 ? "Bagus! Terus tingkatkan pemahamanmu." :
        "Tetap semangat! Pelajari kembali materi eksponen.";

    document.getElementById("detail").innerText =
        `Jawaban benar: ${score} dari ${questions.length} soal.`;
}

function updateTimer() {

    timeLeft--;

    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    document.getElementById("timer").innerText =
        "⏱ " + String(minutes).padStart(2, "0") +
        ":" + String(seconds).padStart(2, "0");

    if (timeLeft <= 0) {
        finishQuiz();
    }
}

function restartQuiz() {

    current = 0;
    score = 0;
    timeLeft = 900;

    document.getElementById("quiz").style.display = "block";
    document.getElementById("result").style.display = "none";

    clearInterval(timerInterval);

    showQuestion();
    startTimer();
}

function startTimer() {
    timerInterval = setInterval(updateTimer, 1000);
}

showQuestion();
startTimer();

</script>

</body>
</html>
